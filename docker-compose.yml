version: "3.9"

services:
  sipmt:
    build: .
    container_name: sipmt-app
    ports:
      - "8501:8501"
    env_file:
          container_name: sipmt-app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:Natalija2006@postgres:5432/incluscape}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/sipmt.db}
      STORE_FILES_IN_DB: ${STORE_FILES_IN_DB:-false}
    volumes:
            DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:Natalija2006@postgres:5432/incluscape}
            DATABASE_PATH: ${DATABASE_PATH:-/app/data/sipmt.db}
      - sipmt_logs:/app/logs
            - sipmt_uploads:/app/uploads
            - sipmt_exports:/app/exports
            - sipmt_logs:/app/logs
            - sipmt_temp:/app/temp
            - sipmt_data:/app/data

  postgres:
    image: postgres:16-alpine
    container_name: sipmt-postgres
    environment:
      POSTGRES_DB: sipmt
          container_name: sipmt-postgres
      POSTGRES_PASSWORD: Natalija2006
            POSTGRES_DB: sipmt
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: Natalija2006
      - sipmt_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

            - sipmt_pgdata:/var/lib/postgresql/data
  sipmt_uploads:
  sipmt_exports:
        sipmt_uploads:
        sipmt_exports:
        sipmt_logs:
        sipmt_temp:
        sipmt_data:
        sipmt_pgdata:
