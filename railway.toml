# Railway Configuration
[build]
builder = "dockerfile"
dockerfile = "./Dockerfile"

[deploy]
numReplicas = 1
startCommand = "streamlit run streamlit_app/app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.fileWatcherType=none"

[env]
# Ollama Configuration
OLLAMA_BASE_URL = "http://ollama:11434"
OLLAMA_MODEL = "qwen2.5:1.5b"
OLLAMA_TIMEOUT_SEC = "600"
OLLAMA_KEEP_ALIVE = "60m"
OLLAMA_NUM_CTX = "4096"
OLLAMA_NUM_GPU = "-1"
OLLAMA_NUM_BATCH = "512"

# Application Configuration
ENABLE_SEMANTIC_ANALYSIS = "true"
DATABASE_PATH = "./data/incluscape.db"
UPLOAD_FOLDER = "./uploads"
EXPORT_FOLDER = "./exports"
TEMP_FOLDER = "./temp"
LOG_LEVEL = "INFO"
DEBUG = "false"

# Streamlit Configuration
STREAMLIT_SERVER_MAXUPLOADSIZE = "20"
STREAMLIT_SERVER_PORT = "8501"
STREAMLIT_SERVER_ADDRESS = "0.0.0.0"
STREAMLIT_SERVER_HEADLESS = "true"
STREAMLIT_BROWSER_GATHEREUSAGESTATS = "false"
