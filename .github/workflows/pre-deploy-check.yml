name: Pre-Deploy Check

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  pre-deploy-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pre-deploy check script
        run: bash scripts/pre_deploy_check.sh
